<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <title>Pagina para contactar a Sophia Santopietro con formulario</title>
</head>

<body>
  <header>
    <div class="header-container">
      <a class="logo" href="index.html">SS</a>
      <nav class="nav-list">
        <a href="about.html">About</a>
        <a href="index.html#skills">Skills</a>
        <a href="index.html#cheatsheets">Cheatsheets</a>
        <a href="index.html#recursos">Recursos</a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="Menú de navegación" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>
  <main>
    <section class="contact">
      <div class="page-intro">
        <p class="section-label">Contacto</p>
        <h1>Hablemos</h1>
        <p>¿Tenés un proyecto en mente, una propuesta o simplemente querés saludar? ¡Escribime!</p>
        <div class="contact-buttons">
          <a class="btn btn-outline" href="https://github.com/sophisantopietro">
            <i class="bi bi-github" aria-hidden="true"></i> GitHub
          </a>
          <a class="btn btn-outline" href="https://www.linkedin.com/in/sophia-santopietro-72621a167/">
            <i class="bi bi-linkedin" aria-hidden="true"></i> LinkedIn
          </a>
        </div>
      </div>

      <form class="contact-form" action="url" method="post">
        <fieldset>
          <legend>Contacta conmigo</legend>

          <div class="form-field">
            <label for="nombre">Nombre completo:</label>
            <input id="nombre" type="text" name="nombre" placeholder="Reyes Limones" required />
          </div>

          <div class="form-field">
            <label for="asunto">Asunto:</label>
            <input id="asunto" type="text" name="asunto" required />
          </div>

          <div class="form-field">
            <label for="email">Email:</label>
            <input id="email" type="email" name="email" placeholder="ejemplo@x.com" required />
          </div>

          <div class="radio-group">
            <p>Quieres a Sophi?</p>
            <input id="radiobt1" type="radio" name="radio-amor" value="1" required />
            <label for="radiobt1">Si</label>
            <input id="radiobt2" type="radio" name="radio-amor" value="2" required />
            <label for="radiobt2">No</label>
          </div>

          <div class="form-field">
            <label for="edad">Rango de edad:</label>
            <select name="edad" id="edad" required>
              <option value="menor">-18</option>
              <option value="medio">Entre 18 y 40</option>
              <option value="anciano">+40</option>
            </select>
          </div>

          <div class="form-field">
            <label for="comentario">Dejame un mensaje:</label>
            <textarea name="comentario" id="comentario" placeholder="Escribe aqui..." rows="3"></textarea>
          </div>
        </fieldset>

        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Enviar</button>
          <button class="btn btn-outline" type="reset">Reset</button>
        </div>
      </form>
    </section>
  </main>
  <footer class="footer-container footer-contacto">
    <div class="footer-content">
      <div class="buttons-footer">
        <a href="https://github.com/sophisantopietro">Github</a>
        <a href="https://www.linkedin.com/in/sophia-santopietro-72621a167/">LinkedIn</a>
        <a href="contacto.html">Contacto</a>
      </div>
      <p>Hecho con ❤ por Sophi</p>
      <div class="copy-right">
        &copy; 2026 Sophia Santopietro - Bootcamp The Bridge
      </div>
    </div>
  </footer>
  <script src="js/app.js"></script>
</body>

</html>
